name: Build Windows Executables & Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Номер версии для сборки (например, 1.0.3)"
        required: false
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Release Version and Inject into core.py & installer.iss
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}".StartsWith("v")) {
            $ver = "${{ github.ref_name }}".TrimStart("v")
          } elseif ("${{ github.event.inputs.version }}" -ne "") {
            $ver = "${{ github.event.inputs.version }}".TrimStart("v")
          } else {
            $ver = "1.0.0"
          }
          Write-Host "Сборка версии: $ver"
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

          # 1. Подставляем точную версию в APP_VERSION внутри core.py
          $coreContent = Get-Content -Path "core.py" -Raw -Encoding UTF8
          $coreContent = $coreContent -replace 'APP_VERSION\s*=\s*"[^"]*"', "APP_VERSION = `"$ver`""
          Set-Content -Path "core.py" -Value $coreContent -Encoding UTF8

          # 2. Подставляем точную версию в MyAppVersion внутри installer.iss
          $issContent = Get-Content -Path "installer.iss" -Raw -Encoding UTF8
          $issContent = $issContent -replace '#define MyAppVersion\s+"[^"]*"', "#define MyAppVersion `"$ver`""
          Set-Content -Path "installer.iss" -Value $issContent -Encoding UTF8

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build MusicVideoStudio (--onedir) to avoid Temp\_MEI DLL errors
        shell: pwsh
        run: |
          # Собираем через --onedir (НЕ --onefile), чтобы python311.dll и все библиотеки
          # лежали стационарно в папке программы и никогда не вызывали ошибку Temp\_MEI...
          pyinstaller --noconfirm --clean --onedir --noconsole `
            --name "MusicVideoStudio_Desktop" `
            app.py

          pyinstaller --noconfirm --clean --onedir `
            --name "MusicVideoStudio_Web" `
            --add-data "web;web" `
            web_app.py

          # Объединяем обе сборки в общую директорию dist/MusicVideoStudio для Inno Setup
          New-Item -ItemType Directory -Force -Path "dist/MusicVideoStudio" | Out-Null
          Copy-Item -Path "dist/MusicVideoStudio_Desktop/*" -Destination "dist/MusicVideoStudio/" -Recurse -Force
          Copy-Item -Path "dist/MusicVideoStudio_Web/*" -Destination "dist/MusicVideoStudio/" -Recurse -Force
          Copy-Item "start_desktop.bat" -Destination "dist/MusicVideoStudio/" -ErrorAction SilentlyContinue
          Copy-Item "start_web.bat" -Destination "dist/MusicVideoStudio/" -ErrorAction SilentlyContinue

      - name: Compile Inno Setup Installer (MusicVideoStudio_Setup.exe)
        shell: pwsh
        run: |
          iscc "/DMyAppVersion=$env:VERSION" installer.iss

      - name: Upload Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: MusicVideoStudio-v${{ env.VERSION }}-Windows
          path: |
            Output/MusicVideoStudio_Setup.exe

      - name: Publish to GitHub Releases (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/MusicVideoStudio_Setup.exe
          generate_release_notes: true
